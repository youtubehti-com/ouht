<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A</title> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://pl29310381.profitablecpmratenetwork.com/f3/f1/14/f3f11422479a989121f35119a95ea880.js"></script>
    <script src="https://pl29310384.profitablecpmratenetwork.com/1f/4d/fc/1f4dfcd01832df6433005c331053354d.js"></script>

    <style>
        :root {
            --p: #e2d1f9; --pk: #ffdae9; --g: #ffd700; --b: #00d2ff;
            --bg: #0b141a; --pnl: rgba(23, 33, 39, 0.98); --txt: white; --wp: 0.1;
        }
        .light-theme {
            --bg: #f0f2f5; --pnl: rgba(255, 255, 255, 0.95); --txt: #111b21; --p: #6a5acd; --wp: 0.4;
        }
        body {
            margin: 0; background: var(--bg); color: var(--txt);
            font-family: 'Segoe UI', sans-serif; height: 100vh;
            overflow: hidden; transition: 0.5s; user-select: none;
        }

        #videoContainer {
            position: fixed; inset: 0; z-index: 1; background: #000;
            display: flex; justify-content: center; align-items: center;
        }
        #shortsFrame, #localVideo { width: 100%; height: 100%; border: none; display: none; object-fit: contain; }

        #adOverlay {
            position: fixed; inset: 0; z-index: 50; background: #000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .ad-content { width: 100%; max-width: 400px; text-align: center; }
        #skipBtn {
            position: absolute; bottom: 100px; right: 0;
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border: 1px solid #666; cursor: not-allowed; opacity: 0.6;
        }
        #skipBtn.active { cursor: pointer; opacity: 1; background: #fff; color: #000; }

        #wp-bg { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: var(--wp); background-image: url('https://web.whatsapp.com/img/bg-chat-tile-dark_a4be512e719549d10e05527f6a012d27.png'); }
        #sT { position: fixed; top: 0; left: 0; width: 60px; height: 60px; z-index: 9999; cursor: pointer; }
        #subC { position: fixed; top: 15px; right: 15px; background: var(--pnl); border: 1px solid var(--pk); padding: 5px 15px; border-radius: 20px; display: flex; align-items: center; gap: 8px; z-index: 1000; }
        
        .node { position: fixed; width: 50px; height: 50px; background: var(--pnl); border: 2px solid var(--p); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; color: var(--p); transition: 0.3s; }
        .node:active { transform: scale(0.8); }

        .glass { position: fixed; background: var(--pnl); border: 1px solid var(--p); border-radius: 20px; padding: 15px; display: none; z-index: 9000; flex-direction: column; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); right: 80px; width: 220px; }
        
        #pEmoji { position: fixed; top: 310px; right: 80px; width: 60px; background: var(--pnl); border: 1px solid var(--p); border-radius: 30px; padding: 15px 0; display: none; flex-direction: column; align-items: center; gap: 15px; z-index: 9001; max-height: 300px; overflow-y: auto; scrollbar-width: none; }
        .emoji-btn { font-size: 28px; cursor: pointer; transition: 0.2s; }

        #eZone { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; z-index: 8000; pointer-events: none; opacity: 0; text-align: center; text-shadow: 0 0 20px rgba(0,0,0,0.5); width: 90%; }
        .pop { animation: cP 1.5s ease-out forwards; }
        @keyframes cP { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; } }

        input, button { padding: 10px; border-radius: 10px; border: 1px solid #444; background: rgba(255,255,255,0.05); color: var(--txt); outline: none; }
        button { cursor: pointer; font-weight: bold; background: #00a884; color: white; border: none; }
    </style>
</head>
<body class="dark-theme">

<div id="sT"></div> 

<div id="videoContainer">
    <div id="adOverlay">
        <div class="ad-content">
            <p style="color:white; margin-bottom:10px;">إعلان</p>
            <div id="container-00e55bc0936560b403e88e60248cee97"></div>
            <script async="async" data-cfasync="false" src="https://pl29310385.profitablecpmratenetwork.com/00e55bc0936560b403e88e60248cee97/invoke.js"></script>
            
            <div style="margin: 20px 0;">
                <script> atOptions = { 'key' : 'ecd37eb3b51978e4cf1c88fb23e69e0b', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} }; </script>
                <script src="https://www.highperformanceformat.com/ecd37eb3b51978e4cf1c88fb23e69e0b/invoke.js"></script>
            </div>
        </div>
        <div id="skipBtn" onclick="App.skipAd()">تخطي الإعلان بعد <span id="timer">5</span></div>
    </div>
    
    <iframe id="shortsFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <video id="localVideo" controls playsinline loop muted></video>
</div>

<div id="wp-bg"></div>

<div id="subC">
    <i class="fa-solid fa-heart" style="color: #ff4f4f;"></i>
    <span style="color:var(--pk)">1,405</span>
</div>

<div style="display:flex; flex-direction:column; gap:10px;">
    <div class="node" style="top:70px; right:20px" onclick="UI.toggle('pSettings')"><i class="fas fa-video"></i></div>
    <div class="node" style="top:130px; right:20px" onclick="UI.toggle('pFilter')"><i class="fas fa-wand-magic-sparkles"></i></div>
    <div class="node" style="top:190px; right:20px; color:var(--g); border-color:var(--g)" onclick="UI.toggle('pMagic')"><i class="fas fa-wand-sparkles"></i></div>
    <div class="node" style="top:250px; right:20px; color:var(--b); border-color:var(--b)" onclick="UI.toggle('pPhr')"><i class="fas fa-comment-dots"></i></div>
    <div class="node" style="top:310px; right:20px" onclick="UI.toggle('pEmoji')"><i class="fa-solid fa-face-smile"></i></div>
</div>

<div id="pSettings" class="glass" style="top:70px">
    <label>رابط أو اسم ملف الفيديو:</label>
    <input type="text" id="ytUrl" value="A.mp4" placeholder="أدخل A.mp4 أو رابط يوتيوب">
    <button onclick="App.startPlayProcess()">تشغيل الآن 🎬</button>
</div>

<div id="pFilter" class="glass" style="top:130px">
    <button onclick="UI.theme('dark')">🌙 ثيم ليلي</button>
    <button onclick="UI.theme('light')">☀️ ثيم نهاري</button>
    <button onclick="UI.filter('hue-rotate(280deg)')">🌸 ثيم وردي</button>
    <button onclick="UI.filter('none')">❌ إلغاء الفلاتر</button>
</div>

<div id="pMagic" class="glass" style="top:190px">
    <label>عدد العناصر السحرية:</label>
    <input type="number" id="emojiCount" value="5" max="15">
    <button onclick="App.triggerMagic()">إطلاق السحر 🧚🏼‍♂️</button>
</div>

<div id="pPhr" class="glass" style="top:250px">
    <input type="text" id="sPhr" placeholder="اكتب رسالة للشاشة...">
    <button onclick="App.triggerPhrase()">🔔 إرسال الآن</button>
</div>

<div id="pEmoji" class="glass">
    <div id="emojiGrid"></div>
</div>

<div id="pAdmin" class="glass" style="top:70px; border-color: var(--g); z-index: 10000;">
    <input type="password" id="adminPass" placeholder="كلمة السر...">
    <button onclick="App.checkAdmin()">دخول 🚀</button>
</div>

<div id="eZone"></div>

<script>
    const _0xP = "Ha20262025@"; 
    const SMART_LINK = "https://www.profitablecpmratenetwork.com/p5xdvi8igm?key=bb15e730477910952e414434bb03be5b";
    let _sec = 0;
    let pendingVideoID = "";
    let isLocalFile = false;

    const App = {
        startPlayProcess: () => {
            const input = document.getElementById("ytUrl").value.trim();
            if (input.toLowerCase() === "a.mp4") {
                isLocalFile = true;
                pendingVideoID = "./A.mp4"; // التأكد من المسار المحلي
                UI.hideAll();
                App.showAd();
            } else {
                let vID = "";
                if (input.includes('shorts/')) vID = input.split('shorts/')[1].split('?')[0];
                else if (input.includes('v=')) vID = input.split('v=')[1].split('&')[0];
                else if (input.includes('youtu.be/')) vID = input.split('youtu.be/')[1].split('?')[0];
                else vID = input;

                if (vID.length >= 11) {
                    isLocalFile = false;
                    pendingVideoID = vID;
                    UI.hideAll();
                    App.showAd();
                } else { alert("الرجاء إدخال رابط صحيح أو A.mp4"); }
            }
        },

        showAd: () => {
            const adOverlay = document.getElementById("adOverlay");
            const skipBtn = document.getElementById("skipBtn");
            const timerSpan = document.getElementById("timer");
            document.getElementById("shortsFrame").style.display = "none";
            document.getElementById("localVideo").style.display = "none";
            adOverlay.style.display = "flex";
            let timeLeft = 5;
            timerSpan.innerText = timeLeft;
            skipBtn.classList.remove("active");
            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    document.getElementById("timer").innerText = timeLeft;
                } else {
                    clearInterval(countdown);
                    skipBtn.classList.add("active");
                    skipBtn.innerText = "تخطي الإعلان »";
                    window.open(SMART_LINK, '_blank');
                }
            }, 1000);
        },

        skipAd: () => {
            if (document.getElementById("skipBtn").classList.contains("active")) {
                document.getElementById("adOverlay").style.display = "none";
                if (isLocalFile) {
                    const v = document.getElementById("localVideo");
                    v.style.display = "block";
                    v.src = pendingVideoID;
                    v.load(); // إعادة تحميل المصدر
                    v.play().catch(e => {
                        console.log("فشل التشغيل التلقائي، سيتم العرض مع تفعيل الصوت يدوياً");
                        v.muted = true; // نفعّل الكتم في حال رفض المتصفح
                        v.play();
                    });
                } else {
                    const f = document.getElementById("shortsFrame");
                    f.style.display = "block";
                    f.src = `https://www.youtube-nocookie.com/embed/${pendingVideoID}?autoplay=1&loop=1&playlist=${pendingVideoID}&rel=0&controls=1`;
                }
                App.visual("🎬");
            }
        },

        visual: (emoji) => {
            const z = document.getElementById("eZone");
            z.innerText = emoji; 
            z.style.fontSize = emoji.length > 5 ? "40px" : "150px";
            z.classList.remove("pop"); 
            void z.offsetWidth; 
            z.classList.add("pop");
        },

        triggerMagic: () => {
            const items = ["🧚🏼‍♂️","🤍","💛","✨","💎","⭐","🌈","🔥","⚡","🌟","🪄","🔮","🧿","💫","👑"];
            const count = document.getElementById('emojiCount').value;
            const res = Array.from({length: count}, () => items[Math.floor(Math.random()*items.length)]).join('');
            UI.hideAll();
            App.visual(res);
        },

        triggerPhrase: () => {
            const txt = document.getElementById("sPhr").value;
            if(txt) { UI.hideAll(); App.visual(txt); }
        },

        checkAdmin: () => {
            if(document.getElementById("adminPass").value === _0xP) {
                alert("تم الدخول"); UI.hideAll();
            } else { alert("خطأ!"); }
        }
    };

    const UI = {
        toggle: (id) => {
            const t = document.getElementById(id);
            const isV = t.style.display === "flex";
            UI.hideAll();
            t.style.display = isV ? "none" : "flex";
        },
        hideAll: () => {
            document.querySelectorAll('.glass').forEach(p => p.style.display = "none");
        },
        theme: (m) => { 
            document.body.classList.toggle('light-theme', m === 'light');
            UI.hideAll();
        },
        filter: (f) => {
            document.getElementById('videoContainer').style.filter = f;
            UI.hideAll();
        }
    };

    const emojis = ["💜","💌","💣","🫀","💎","😍","😂","🤣","😻","🔥","✨","⭐","🙈","🙊","🙉","❤️","💖","🌈"];
    const grid = document.getElementById("emojiGrid");
    emojis.forEach(e => {
        let btn = document.createElement("div");
        btn.className = "emoji-btn";
        btn.innerText = e;
        btn.onclick = () => { UI.hideAll(); App.visual(e); };
        grid.appendChild(btn);
    });

    document.getElementById('sT').onclick = () => {
        _sec++; if(_sec >= 5) { UI.toggle('pAdmin'); _sec = 0; }
        setTimeout(() => _sec = 0, 2000);
    };
</script>
</body>
</html>
