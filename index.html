<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Video Host Source</title>
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        video { max-width: 100%; border: 2px solid #c5a059; }
    </style>
</head>
<body>

    <!-- الجزء الأهم: crossorigin تسمح لكِ بسحب الصوت من رابط خارجي لاحقاً -->
    <video id="mainVideo" controls crossorigin="anonymous" preload="auto">
        <source src="leson-video.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>

</body>
</html>
