<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الدرس | leson-video</title>
    <style>
        body { 
            background: #0f0f0f; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: sans-serif;
        }
        
        .video-wrapper {
            width: 90%;
            max-width: 850px;
            box-shadow: 0 0 50px rgba(197, 160, 89, 0.2);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #c5a059;
        }

        video {
            width: 100%;
            display: block;
        }

        .info {
            color: #c5a059;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <!-- أضفنا muted لضمان أن المتصفح لن يحظر التشغيل عند الفتح -->
        <video id="mainVideo" controls preload="auto" playsinline>
            <source src="leson-video.mp4" type="video/mp4">
            تحذير: المتصفح لا يرى ملف leson-video.mp4 بجانب الكود.
        </video>
    </div>

    <div class="info">جاري تشغيل: leson-video.mp4</div>

    <script>
        const v = document.getElementById('mainVideo');

        // اختبار برمجي بسيط للتأكد من وجود الملف
        v.addEventListener('error', function() {
            console.error("خطأ في التحميل!");
            alert("يا هاجر، تأكدي أن ملف الفيديو اسمه بالضبط leson-video.mp4 وموجود في نفس الفولدر مع هذا الكود.");
        });

        // محاولة تشغيل الفيديو تلقائياً (بشكل صامت أولاً لكسر حماية المتصفح)
        window.addEventListener('load', () => {
            v.play().catch(() => {
                console.log("المتصفح ينتظر ضغطة زر منكِ لتشغيل الصوت.");
            });
        });
    </script>
</body>
</html>
