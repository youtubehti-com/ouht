<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحكم الصوتي المتقدم | الوقف بالروم</title>
    <style>
        :root {
            --primary: #1b4d3e;
            --gold: #c5a059;
            --bg: #f9fbf9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* حاوية التحكم العائمة */
        .master-controls {
            position: fixed; bottom: 20px; right: 20px;
            background: white; padding: 15px; border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 15px; z-index: 9999;
        }

        .btn {
            width: 55px; height: 55px; border-radius: 50%;
            border: none; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            font-size: 24px; transition: 0.3s;
        }

        #activationBtn { background: var(--gold); color: white; }
        #playPauseBtn { background: var(--primary); color: var(--gold); display: none; }

        .text-container {
            max-width: 800px; background: white; padding: 40px;
            border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-top: 50px;
        }

        /* تأثير المزامنة الذكي */
        .sync-block {
            padding: 10px; margin: 10px 0; border-radius: 8px;
            transition: all 0.5s ease; border-right: 4px solid transparent;
        }

        .highlight {
            background-color: rgba(197, 160, 89, 0.15);
            border-right: 4px solid var(--gold);
            transform: translateX(-5px);
        }

        /* إخفاء الفيديو تماماً مع الحفاظ على قدرة السحب منه */
        #videoSource {
            position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
        }
    </style>
</head>
<body>

<!-- سحب الفيديو من GitHub -->
<video id="videoSource" preload="auto">
    <!-- استبدلي الرابط التالي برابط الـ Raw الخاص بكِ من GitHub -->
    <source src="https://raw.githubusercontent.com/username/repo/main/leson-video.mp4" type="video/mp4">
</video>

<div class="master-controls">
    <div id="initLabel" style="font-size: 14px; font-weight: bold; color: var(--primary);">تفعيل الصوت 👈</div>
    <button id="activationBtn" class="btn" onclick="initAndLink()">☝️</button>
    <button id="playPauseBtn" class="btn" onclick="togglePlayback()">▶️</button>
</div>

<div class="text-container">
    <div id="segment_1" class="sync-block">
        <h3>مقدمة الدرس</h3>
        <p>بسم الله الرحمن الرحيم، نرحب بكم في هذا اللقاء التعليمي.</p>
    </div>

    <div id="segment_2" class="sync-block">
        <h3>تعريف الروم</h3>
        <p>الروم هو الإتيان ببعض الحركة بصوت خفي يدركه القريب.</p>
    </div>
</div>

<script>
    const media = document.getElementById('videoSource');
    const playBtn = document.getElementById('playPauseBtn');
    const initBtn = document.getElementById('activationBtn');
    const initLabel = document.getElementById('initLabel');

    // دالة الربط والتفعيل المباشر
    function initAndLink() {
        // "حقن" الصوت في المتصفح لكسر الحماية
        media.play().then(() => {
            media.pause();
            media.currentTime = 0;
            
            // تبديل الواجهة
            initBtn.style.display = 'none';
            initLabel.style.display = 'none';
            playBtn.style.display = 'flex';
        }).catch(e => console.log("بانتظار التفاعل الحقيقي..."));
    }

    function togglePlayback() {
        if (media.paused) {
            media.play();
            playBtn.innerText = "⏸️";
        } else {
            media.pause();
            playBtn.innerText = "▶️";
        }
    }

    // نظام المزامنة مع "التجاهل الذكي"
    media.ontimeupdate = () => {
        const now = media.currentTime;
        
        // خريطة التوقيت: اكتبي فقط الأجزاء التي تريدين تلوينها
        // أي وقت آخر في الفيديو سيتم تجاهله آلياً ولن يحدث خطأ
        const timeline = [
            { id: 'segment_1', start: 0, end: 12 },
            { id: 'segment_2', start: 13, end: 45 }
        ];

        timeline.forEach(item => {
            const el = document.getElementById(item.id);
            if (el) {
                if (now >= item.start && now <= item.end) {
                    el.classList.add('highlight');
                } else {
                    el.classList.remove('highlight');
                }
            }
        });
    };

    // معالجة حالة انتهاء الفيديو
    media.onended = () => {
        playBtn.innerText = "▶️";
        media.currentTime = 0;
    };
</script>

</body>
</html>
